[package]
name = "para"
version = "0.1.0"
edition = "2024"
description = "Parakeet STT cli"
repository = "https://github.com/jlec/para"
license = "Apache-2.0"
# tests/support.rs is a shared helper module included via #[path] from
# contract.rs/integration.rs, not a standalone test file -- explicit [[test]]
# targets below replace directory auto-discovery so it isn't also compiled
# as its own (empty) test binary.
autotests = false

[[test]]
name = "contract"
path = "tests/contract.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "6.0.0"
indicatif = "0.18.6"
ort = { version = "2.0.0-rc.12", features = ["coreml", "download-binaries"] }
reqwest = { version = "0.13.4", features = ["blocking", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
which = "8.0.4"

[build-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
integration = []

[profile.release]
strip = true
lto = true
codegen-units = 1
