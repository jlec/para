---
name: Continuous Integration

# yamllint disable-line rule:truthy
on:
  # yamllint disable-line rule:empty-values
  workflow_dispatch:

  # yamllint disable-line rule:empty-values
  pull_request:

  push:
    branches:
      - "*"
    tags-ignore:
      - "**"

permissions: read-all

jobs:
  ##############################################################################
  #
  # Run on everything but Releases and WIP
  #
  ##############################################################################
  linting:
    if: >-
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.event.head_commit.message, 'WIP')
    name: "Run Linting against all files"
    uses: jlec/github-actions/.github/workflows/reusable-linting.yml@main
    secrets: inherit
    with:
      ansible-support: false
  rust-build-test:
    name: "Rust Build & Test"
    if: >-
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.event.head_commit.message, 'WIP')
    needs:
      - linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo deny check

  dependabot:
    name: "Handle dependabot PR"
    if: >-
      github.actor == 'dependabot[bot]' &&
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.event.head_commit.message, 'WIP')
    needs:
      - linting
    uses: jlec/github-actions/.github/workflows/reusable-pr-dependabot.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  ci-generic:
    name: "Run generic CI"
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.event.head_commit.message, 'WIP') &&
      needs.linting.result == 'success'
    needs:
      - rust-build-test
      - dependabot
      - linting
    uses: jlec/github-actions/.github/workflows/reusable-ci-generic.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  ci-release:
    name: "Run Release CI"
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.event.head_commit.message, 'bump:') &&
      !startsWith(github.event.head_commit.message, 'WIP') &&
      needs.ci-generic.result == 'success'
    needs:
      - ci-generic
    uses: jlec/github-actions/.github/workflows/reusable-ci-release.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      licensed-files: |-
        LICENSE
        src/**/*.rs
