---
name: Continuous Delivery

# yamllint disable-line rule:truthy
on:
  # yamllint disable-line rule:empty-values
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  cargo-dist:
    name: "Rust Release"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release
      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.os == 'macos-latest' && 'arm64' || 'amd64' }}
          path: target/release/${{ github.event.repository.name }}
  release-and-clean:
    name: Release the code & clean up
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    needs:
      - cargo-dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Cleanup action status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          status: "success"
          token: ${{ secrets.GITHUB_TOKEN }}
          context: "GithubActions - ${GITHUB_WORKFLOW}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # files: |
          #   ${{ github.event.repository.name }}-macos-arm64.tar.gz
          #   ${{ github.event.repository.name }}-linux-amd64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tap token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GHA_CLIENT_ID }}
          private-key: ${{ secrets.GHA_APP_PRIVATE_KEY }}
          owner: jlec
          repositories: homebrew-tap
      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256="$(cat para-macos-arm64.sha256)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jlec/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|version \"[^\"]*\"|version \"${version}\"|" Formula/para.rb
          sed -i '' -E \
            "s|download/v[^/]*/para-macos-arm64\.tar\.gz|download/v${version}/para-macos-arm64.tar.gz|" \
            Formula/para.rb
          sed -i '' -E "s|sha256 \"[^\"]*\"|sha256 \"${sha256}\"|" Formula/para.rb
          git config user.name "para-release-bot"
          git config user.email "actions@github.com"
          git add Formula/para.rb
          git commit -m "para ${version}"
          git push origin main
