---
name: Continuous Delivery

# yamllint disable-line rule:truthy
on:
  # yamllint disable-line rule:empty-values
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  build-and-release:
    name: "Build macOS release binary and publish"
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Package binary
        run: |
          tar -czf para-macos-arm64.tar.gz -C target/release para
          shasum -a 256 para-macos-arm64.tar.gz | awk '{print $1}' > para-macos-arm64.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: para-macos-arm64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tap token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GHA_CLIENT_ID }}
          private-key: ${{ secrets.GHA_APP_PRIVATE_KEY }}
          owner: jlec
          repositories: homebrew-tap
      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256="$(cat para-macos-arm64.sha256)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jlec/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s|version \"[^\"]*\"|version \"${version}\"|" Formula/para.rb
          sed -i '' -E \
            "s|download/v[^/]*/para-macos-arm64\.tar\.gz|download/v${version}/para-macos-arm64.tar.gz|" \
            Formula/para.rb
          sed -i '' -E "s|sha256 \"[^\"]*\"|sha256 \"${sha256}\"|" Formula/para.rb
          git config user.name "para-release-bot"
          git config user.email "actions@github.com"
          git add Formula/para.rb
          git commit -m "para ${version}"
          git push origin main
